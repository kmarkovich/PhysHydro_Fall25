name: Convert Markdown to Word

on:
  push:
    branches:
      - main # Or your desired branch

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert README.md to DOCX
        run: |
          pandoc -f markdown -t docx -o syllabus.docx README.md
